[project]
name = "world4-api"
version = "0.1.0"
description = "FastAPI service exposing the World4 engine over HTTP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "world4-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
world4-api = "world4_api.app:run"

[tool.uv.sources]
world4-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world4_api"]
