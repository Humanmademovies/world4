[project]
name = "world4-core"
version = "0.1.0"
description = "World4 headless physical-accounting engine (Leontief / EXIOBASE). No UI or web dependencies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "World4 contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pymrio>=0.5.4",
    "pydantic>=2.7",
]

[project.scripts]
world4 = "world4_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world4_core"]
