# World4 — uv workspace root (virtual; not a distributable package).
# Members are the headless engine (packages/world4-core) and the API (apps/api).
[project]
name = "world4-workspace"
version = "0.1.0"
description = "Physical accounting model of world consumption — workspace root"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "world4-core",
    "world4-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/world4-core", "apps/api"]

[tool.uv.sources]
world4-core = { workspace = true }
world4-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "bandit>=1.7",
    "pre-commit>=4.6.1",
    "httpx>=0.27",            # FastAPI TestClient
]

# ----------------------------------------------------------------------------
# Tooling configuration shared across the workspace.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/world4-core/src", "apps/api/src"]

[tool.ruff.lint]
# Reasonable, strict-but-not-noisy default rule set.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["world4_core", "world4_api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
# Numpy/pandas/pymrio are Any-heavy at the boundary; keep the valuable strict
# checks (untyped defs, etc.) but don't drown in generic/return-Any noise there.
disallow_any_generics = false
warn_return_any = false
# Third-party scientific libs ship incomplete stubs; don't fail on them.
[[tool.mypy.overrides]]
module = ["pymrio.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/world4-core/tests", "apps/api/tests"]
addopts = "-ra -q"
markers = [
    "exiobase: requires a downloaded EXIOBASE dataset (skipped by default in CI)",
]

[tool.coverage.run]
source = ["world4_core", "world4_api"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
