version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["ruff", "mypy", "bandit", "pytest*", "pre-commit", "httpx"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
